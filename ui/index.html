<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cropic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128444;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desk">
  <div id="water">
    <div class="waves">
      <div class="wave back"></div>
      <div class="wave front"></div>
    </div>
  </div>
</div>

<div id="topbar">
  <span class="brand">cropic</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="btnInfo" aria-label="Acerca de Cropic">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
      <path d="M12 2.2a9.8 9.8 0 1 0 0 19.6 9.8 9.8 0 0 0 0-19.6Zm0 4.1a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7Zm1.5 11.3h-3a.95.95 0 0 1 0-1.9h.55v-3.6h-.4a.95.95 0 0 1 0-1.9h1.35c.52 0 .95.43.95.95v4.55h.55a.95.95 0 0 1 0 1.9Z"/>
    </svg>
  </button>
  <button class="iconbtn" id="btnIG" aria-label="Vista previa de Instagram">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5.2"/>
      <circle cx="12" cy="12" r="4.1"/>
      <circle cx="17.4" cy="6.6" r="1.05" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button class="iconbtn" id="btnSound" aria-label="Sonido">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
      <path d="M13.2 3.3a1 1 0 0 1 .55.9v15.6a1 1 0 0 1-1.62.78L7.4 16.9H4.6A1.6 1.6 0 0 1 3 15.3V8.7a1.6 1.6 0 0 1 1.6-1.6h2.8l4.73-3.68a1 1 0 0 1 1.07-.12Z"/>
      <path class="wave1" d="M16.6 8.3a1 1 0 0 1 1.4.16 5.9 5.9 0 0 1 0 7.08 1 1 0 1 1-1.56-1.24 3.9 3.9 0 0 0 0-4.6 1 1 0 0 1 .16-1.4Z"/>
      <path class="wave2" d="M19.3 5.3a1 1 0 0 1 1.4.13 10 10 0 0 1 0 13.14 1 1 0 1 1-1.5-1.32 8 8 0 0 0 0-10.5 1 1 0 0 1 .1-1.45Z"/>
      <path class="mute" d="M17.3 9.3a1 1 0 0 1 1.4 0l1.3 1.29 1.3-1.3a1 1 0 1 1 1.4 1.42L21.4 12l1.3 1.29a1 1 0 0 1-1.4 1.42L20 13.4l-1.3 1.3a1 1 0 0 1-1.4-1.42L18.6 12l-1.3-1.29a1 1 0 0 1 0-1.42Z"/>
    </svg>
  </button>
  <button class="iconbtn" id="btnTheme" aria-label="Tema claro u oscuro">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
      <g class="sun">
        <circle cx="12" cy="12" r="4.6"/>
        <path d="M12 1.4a1 1 0 0 1 1 1v1.7a1 1 0 1 1-2 0V2.4a1 1 0 0 1 1-1Zm0 16.5a1 1 0 0 1 1 1v1.7a1 1 0 1 1-2 0v-1.7a1 1 0 0 1 1-1ZM22.6 12a1 1 0 0 1-1 1h-1.7a1 1 0 1 1 0-2h1.7a1 1 0 0 1 1 1ZM6.1 12a1 1 0 0 1-1 1H3.4a1 1 0 1 1 0-2h1.7a1 1 0 0 1 1 1Zm13.4-7.5a1 1 0 0 1 0 1.4l-1.2 1.2a1 1 0 1 1-1.4-1.4l1.2-1.2a1 1 0 0 1 1.4 0ZM7.1 16.9a1 1 0 0 1 0 1.4l-1.2 1.2a1 1 0 0 1-1.4-1.4l1.2-1.2a1 1 0 0 1 1.4 0Zm12.4 2.6a1 1 0 0 1-1.4 0l-1.2-1.2a1 1 0 0 1 1.4-1.4l1.2 1.2a1 1 0 0 1 0 1.4ZM7.1 7.1a1 1 0 0 1-1.4 0L4.5 5.9a1 1 0 0 1 1.4-1.4l1.2 1.2a1 1 0 0 1 0 1.4Z"/>
      </g>
      <path class="moon" d="M20.7 14.6A9 9 0 0 1 9.4 3.3a1 1 0 0 0-1.3-1.2 10.5 10.5 0 1 0 13.8 13.8 1 1 0 0 0-1.2-1.3Z"/>
    </svg>
  </button>
</div>

<div id="app">

  <section class="win panel" style="position:relative">
    <div class="titlebar">fotos<span class="dots"><i class="dot"></i><i class="dot"></i></span></div>
    <div class="winbody">
      <button class="btn wide primary pencil" id="btnOpen">Abrir imagenes</button>
      <button class="btn wide pencil" id="btnFolder">Abrir carpeta</button>
      <div id="filelist"></div>
      <button class="btn wide pencil" id="btnClear">Vaciar</button>
    </div>
  </section>

  <section class="win panel" style="position:relative">
    <div class="titlebar"><span id="winTitle">vista previa</span>
      <span class="dots"><i class="dot"></i><i class="dot"></i></span></div>
    <div class="winbody">
      <div id="stage">
        <img id="stageimg" alt="">
        <canvas id="overlay"></canvas>
        <button class="stagebtn on" id="btnFaces" aria-label="Marcar los rostros">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <path d="M3 8V5.4A2.4 2.4 0 0 1 5.4 3H8M16 3h2.6A2.4 2.4 0 0 1 21 5.4V8M21 16v2.6a2.4 2.4 0 0 1-2.4 2.4H16M8 21H5.4A2.4 2.4 0 0 1 3 18.6V16"
                  fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
            <circle cx="12" cy="10.4" r="2.9" fill="currentColor"/>
            <path d="M6.9 18.2c.6-2.7 2.7-4.2 5.1-4.2s4.5 1.5 5.1 4.2" fill="none"
                  stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="drop">
          <img src="img/icon-work.webp" alt="" width="72" height="75" id="dropicon">
          <div>Arrastra aqui tus imagenes o pulsa abrir imagenes</div>
        </div>
      </div>
      <div class="row">
        <div class="row" style="gap:6px">
          <button class="btn pencil low" id="btnAuto">Auto</button>
          <button class="btn pencil low" id="btnFull">Sin recortar UI</button>
          <button class="btn pencil low" id="btnEdit">Ajustar borde</button>
        </div>
      </div>
      <div class="row between">
        <div class="tabs">
          <button class="tab sel" id="tabVar">variaciones</button>
          <button class="tab" id="tabSplit">partido</button>
        </div>
        <div class="row" id="splitCtl" style="display:none;gap:8px">
          <label class="small" for="selPieces">piezas</label>
          <select id="selPieces">
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
          <label class="small" for="selCut">cortar</label>
          <select id="selCut"></select>
          <label class="small">tamano</label>
          <input type="range" id="rngZoom" min="50" max="100" value="0" step="5" style="width:80px">
          <button class="btn" id="btnZoomAuto">auto</button>
        </div>
      </div>
      <div id="variants"></div>
      <div id="splitRow" style="display:none">
        <div id="pieces"></div>
        <div class="row" style="margin-top:6px; justify-content:flex-end">
          <button class="btn primary pencil" id="btnExportSplit">Exportar las piezas</button>
        </div>
      </div>
    </div>
  </section>

  <section class="win panel" id="side" style="position:relative">
    <div class="titlebar">formato<span class="dots"><i class="dot"></i><i class="dot"></i></span></div>
    <div class="winbody">
      <div class="dd" id="ddPreset">
        <button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="ar" id="arPreview"><i></i></span>
          <span class="dd-label" id="ddLabel"></span>
          <svg class="dd-caret" viewBox="0 0 24 24" width="13" height="13" fill="none"
               stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dd-menu" id="ddMenu" role="listbox" hidden></div>
      </div>

      <div>
        <div class="seg" id="segFmt">
          <button class="seg-btn sel" data-fmt="jpg">jpg</button>
          <button class="seg-btn" data-fmt="png">png</button>
          <button class="seg-btn" data-fmt="webp">webp</button>
          <button class="seg-btn" data-fmt="tiff">tiff</button>
        </div>
      </div>
      <div class="row between" id="rowDpi" style="display:none">
        <label class="small" for="inpDpi">calidad de impresion</label>
        <select id="inpDpi">
          <option value="300" selected>300 dpi</option>
          <option value="600">600 dpi</option>
        </select>
      </div>

      <div id="sheetBox" style="display:none">
        <div class="section-title">plancha para imprimir</div>
        <div class="row between">
          <select id="selSheet" style="flex:1"></select>
        </div>
        <button class="btn wide" id="btnSheet">Armar plancha</button>
      </div>

      <button class="btn wide primary pencil" id="btnExport">Exportar seleccion</button>
      <button class="btn wide pencil" id="btnExportAll">Exportar todas (mejor variante)</button>
      <button class="btn wide pencil" id="btnOut">Carpeta de salida...</button>

      <div id="info">Carga una captura para empezar.</div>
    </div>
  </section>
</div>

<section class="win" id="metawin" hidden>
  <div class="titlebar" id="metadrag"><span id="metatitle">datos</span>
    <span class="dots"><i class="dot"></i><i class="dot"></i>
      <button class="closebtn" id="metaclose" aria-label="Cerrar"></button></span>
  </div>
  <div class="winbody"><div id="metabody"></div></div>
</section>

<section class="win" id="infowin" hidden>
  <div class="titlebar" id="infodrag">acerca de
    <span class="dots"><i class="dot"></i><i class="dot"></i>
      <button class="closebtn" id="infoclose" aria-label="Cerrar"></button></span>
  </div>
  <div class="winbody" id="infobody">
    <img src="img/logo.png" alt="Cropic" id="infologo">
    <p class="contacto">contacto<br><b>gringogringacho435@gmail.com</b></p>
  </div>
</section>

<section class="win" id="igwin" hidden>
  <div class="titlebar" id="igdrag">instagram
    <span class="dots"><i class="dot"></i><i class="dot"></i>
      <button class="closebtn" id="igclose" aria-label="Cerrar"></button></span>
  </div>
  <div class="winbody">
    <img class="chrome" src="img/ig-top.png" alt="">
    <div id="igphoto">
      <img id="igimg" alt="">
      <button class="ignav prev" id="igprev" hidden aria-label="Anterior">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button class="ignav next" id="ignext" hidden aria-label="Siguiente">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <span class="igcount" id="igcount" hidden></span>
    </div>
    <div id="igdots"></div>
    <img class="chrome" src="img/ig-bottom.png" alt="">
  </div>
</section>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
